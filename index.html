<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="robots" content="noindex, nofollow">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DUKOPS">
    <title>SISTEM PELAPORAN DUKOPS BABINSA</title>
    <meta name="theme-color" content="#0a1a3a">

    <link rel="icon" type="image/x-icon" href="icons/favicon.ico" />
    <link rel="icon" type="image/png" href="icons/favicon-96x96.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <script>
        (function () {
            if (window.location.protocol !== 'file:') {
                const link = document.createElement('link');
                link.rel = 'manifest';
                link.href = 'site.webmanifest';
                document.head.appendChild(link);
            }
        })();
    </script>

    <!-- Library eksternal -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" onerror="this.onerror=null;this.src='html2canvas.min.js'"></script>

    <!-- CSS MODULAR -->
    <link rel="stylesheet" href="css/main.css">
    <script src="js/cursor.js"></script>

    <!-- Sembunyikan tooltip indikator Supabase -->
    <style>
        .indicator-tooltip { display: none !important; }
        .supabase-indicator { cursor: default; }

        /* Gaya untuk tab CanvasPRO dengan iframe */
        #canvasproContent {
            display: none;
            padding: 0;
            background: #0f1b2f;
            border-radius: 12px;
            margin-top: 10px;
            height: 80vh;
            overflow: hidden;
        }
        #canvasproContent.active {
            display: block;
        }
        #canvasproContent iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
            background: #1a2744;
        }
        /* Penyesuaian untuk tampilan mobile */
        @media (max-width: 600px) {
            #canvasproContent {
                height: 70vh;
            }
        }

        .village-start-screen .splash-content {
            width: min(92vw, 430px);
            padding: 34px 20px 24px;
            background-image:
                linear-gradient(rgba(11, 22, 10, 0.78), rgba(11, 22, 10, 0.88)),
                url('header/header-background.png');
            background-size: cover;
            background-position: center;
            border: 1px solid rgba(135, 187, 255, 0.7);
            border-radius: 22px;
            box-shadow: 0 20px 55px rgba(0, 0, 0, 0.55);
        }

        .village-start-screen {
            background: rgba(5, 15, 30, 0.68);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }

        .village-start-screen .startup-logo {
            display: block;
            width: min(220px, 72vw);
            height: auto;
            max-height: 150px;
            object-fit: contain;
            margin: 0 auto 28px;
        }

        .village-start-screen select {
            width: 100% !important;
            min-height: 54px;
            padding: 10px 42px 10px 16px !important;
            border-radius: 40px !important;
            border: 1px solid rgba(191, 220, 255, 0.8) !important;
            background: linear-gradient(110deg, #4d96ff, #21469d) !important;
            color: #ffffff !important;
            font-size: clamp(15px, 2.8vw, 20px) !important;
            font-weight: 500 !important;
            line-height: 1.2;
            white-space: nowrap;
            text-overflow: ellipsis;
            box-shadow: 0 12px 22px rgba(32, 102, 224, 0.3);
            text-align: left;
        }

        .village-start-screen .splash-kodim-center {
            margin-top: 30px;
            color: #d9e6f5;
            font-size: 12px;
            font-weight: 600;
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            line-height: 20px;
            height: 20px;
        }

        .running-text span {
            display: inline-block;
            padding-left: 100%;
            white-space: nowrap !important;
            animation-name: runningText !important;
            animation-duration: 12s !important;
            animation-timing-function: linear !important;
            animation-iteration-count: infinite !important;
            animation-fill-mode: both !important;
        }

        @keyframes runningText {
            from { transform: translateX(0); }
            to { transform: translateX(-100%); }
        }

        .startup-dashboard {
            filter: blur(7px);
            transform: scale(1.015);
            pointer-events: none;
        }

        .datetime-picker-area {
            position: relative;
        }

        .datetime-input-shell {
            position: relative;
            margin-top: 4px;
            container-type: inline-size;
        }

        .datetime-picker-area input[type="datetime-local"] {
            color: transparent !important;
            caret-color: transparent;
            margin-top: 0;
        }

        .datetime-picker-area input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            display: none;
        }

        .datetime-input-display {
            position: absolute;
            inset: 0 10px;
            display: flex;
            align-items: center;
            color: #0a1a2e;
            font-size: clamp(9px, 2cqw, 14px);
            font-weight: 500;
            letter-spacing: -0.4px;
            line-height: 1;
            white-space: nowrap;
            overflow: hidden;
            pointer-events: none;
        }

    </style>

</head>
<body>

    <!-- ====== INDIKATOR SUPABASE (tooltip disembunyikan) ====== -->
    <div id="supabaseIndicator" class="supabase-indicator indicator-checking" title="Status Koneksi Supabase">
        <div class="indicator-dot"></div>
        <span class="indicator-tooltip"></span>
    </div>

    <!-- ====== PEMILIHAN DESA AWAL ====== -->
    <div id="splashScreen" class="splash-container-modern village-start-screen">
        <div class="splash-content">
            <img class="startup-logo" src="logo/logo-1.png" alt="Logo DUKOPS BABINSA">
            <select id="startupDesa">
                <option value="">Memuat daftar wilayah...</option>
            </select>
            <div class="splash-kodim-center running-text" aria-label="Informasi aplikasi">
                <span id="runningTextContent">Sistem Pelaporan Digitalisasi Babinsa</span>
            </div>
            <div class="splash-army">
            </div>
        </div>
    </div>

    <!-- ====== APP CONTAINER ====== -->
    <div id="appContainer" class="container startup-dashboard" style="display: block; opacity: 1;">

        <!-- Install Button -->
        <button id="installButton" style="display:none;">
            <i class="fas fa-download"></i> Install App
        </button>

        <!-- ===== NAVIGASI ===== -->
        <div class="nav-buttons">
            <button class="nav-btn nav-btn-dukops active" id="btnDukops" onclick="showDukops()">DUKOPS</button>
            <button class="nav-btn nav-btn-absen" id="btnAbsen" onclick="showAbsenTab()">ABSEN</button>
            <button class="nav-btn nav-btn-hanpangan" id="btnHanpangan" onclick="showHanpangan()">PIKET</button>
            <!-- TAB BARU: CanvasPRO dengan iframe -->
            <button class="nav-btn nav-btn-canvaspro" id="btnCanvaspro" onclick="showCanvaspro()">CanvasPRO</button>
        </div>

        <!-- ===== CONTENT DUKOPS ===== -->
        <div id="dukopsContent">
            <div style="width:100%; margin:0 auto;">

                <div id="dashboardDesaSelection" style="display:none;">
                    <label id="labelPilihDesa"><i class="fas fa-city"></i> Pilih Desa/Kelurahan:</label>
                    <div class="select-wrapper" style="position:relative;">
                    <select id="selectDesa" onchange="loadSelectedDesa()">
                        <option value="">--Pilih desa/Kelurahan--</option>
                    </select>
                    </div>
                </div>
                <div id="loadingDesa" style="display:none;"><i class="fas fa-spinner fa-spin"></i> Memuat...</div>
                <div class="previewBox" id="previewDesa" style="display:none;"></div>

                <label id="labelKoordinat" style="display:none;"><i class="fas fa-map-pin"></i> Koordinat:</label>
                <div id="loadingKoordinat" style="display:none;"><i class="fas fa-spinner fa-spin"></i> Memuat koordinat...</div>
                <div class="previewBox" id="previewKordinat"><span style="color:#6a7a8a;">Pilih desa/Kelurahan untuk melihat koordinat</span></div>

                <div class="datetime-picker-area" role="button" tabindex="0" onclick="openDatePicker(event)" onkeydown="if (event.key === 'Enter' || event.key === ' ') openDatePicker(event)">
                    <div class="datetime-input-shell">
                        <input type="datetime-local" id="tanggalWaktu" onchange="updateDatePreview()">
                        <span id="tanggalWaktuDisplay" class="datetime-input-display">INPUT TANGGAL</span>
                    </div>
                </div>

                <div class="file-input-wrapper">
                    <input type="file" id="gambar" accept="image/*" onchange="previewImage()">
                    <label class="file-input-button" for="gambar"><i class="fas fa-folder-open"></i> Pilih Foto</label>
                </div>

                <canvas id="canvas" style="display:none;" aria-label="Preview foto kegiatan"></canvas>

                <label id="labelNarasiKegiatan">Kegiatan: Babinsa</label>
                <div class="narasi-wrapper">
                    <textarea id="narasi" class="auto-height-textarea" rows="6" placeholder="Masukkan narasi kegiatan...✍️" oninput="checkInputCompletion(); autoResizeNarasi()"></textarea>
                </div>

                <div class="action-buttons">
                    <button id="submitBtn" onclick="processSubmission()" disabled>
                        <i class="fas fa-download"></i> KIRIM
                    </button>
                    <button id="btnExit" class="action-exit-btn" onclick="exitApp()"><i class="fas fa-right-from-bracket"></i> KELUAR</button>
                    <!-- Tombol LAPORAN telah dihapus -->
                </div>

                <div id="attendancePanel" style="display: none;">
                    <div class="attendance-header">
                        <button onclick="hideAttendance()" class="btn-close-3d btn-compact">TUTUP</button>
                    </div>
                    <div class="attendance-filters">
                        <span class="attendance-selected-desa" id="attendanceSelectedDesa">
                            Desa dipilih: <span id="attendanceSelectedDesaName">Silahkan Pilih Desa</span>
                        </span>
                        <div class="month-picker-area" id="attendanceMonthPicker" tabindex="0" role="button">
                            <input type="month" id="attendanceMonthFilter" onchange="loadAttendanceData()">
                        </div>
                    </div>
                    <div id="attendanceLoading" style="display: none; text-align: center; padding: 20px;">
                        <i class="fas fa-spinner fa-spin"></i> 🪖 Tunggu..laporan akan di tampilkan
                    </div>
                    <div id="attendanceSummary" class="attendance-summary" style="display: none;">
                        <div class="summary-row"><span>Total Laporan:</span><span id="totalReports">0</span></div>
                        <div class="summary-row"><span>Total Desa:</span><span id="totalDesa">0</span></div>
                        <div class="summary-row"><span>Pencapaian Target:</span><span id="targetStatus">0%</span></div>
                    </div>
                    <div id="attendanceList" style="max-height: 400px; overflow-y: auto;"></div>
                </div>

            </div>
        </div>

        <!-- ===== ABSEN ===== -->
        <div id="absenContent" style="display: none;">
            <div class="absen-card">
                <div class="absen-filter-row">
                    <div class="form-group">
                        <label>📅 TAHUN</label>
                        <select id="absenTahunSelect"><option>Memuat...</option></select>
                    </div>
                    <div class="form-group">
                        <label>📆 BULAN</label>
                        <select id="absenBulanSelect" disabled><option>Pilih tahun</option></select>
                    </div>
                </div>
            </div>
            <div id="absenResultContainer"></div>
            <div class="absen-info-text">✨ Mangsatria@2026</div>
        </div>

        <!-- ===== PIKET (FULLSCREEN) - SUDAH DIPERBAIKI ===== -->
        <div id="hanpanganContent" style="display: none; background-color: #263a24; min-height: 100vh; width: 100%;">
            <iframe src="https://sukasada05.github.io/Hanpangan/" title="PIKET" style="width:100%; height:100vh; border:none; display:block;"></iframe>
        </div>

        <!-- ===== CANVASPRO (iframe) ===== -->
        <div id="canvasproContent">
            <iframe src="https://canvaspro.sukasada1609-05.workers.dev/" title="CanvasPRO 2.1" allow="clipboard-read; clipboard-write"></iframe>
        </div>

    </div>

    <div id="absenScreenshotArea" style="position: fixed; left: -9999px; top: 0; width: 500px; background: white;"></div>

    <!-- ====== SATU SCRIPT EKSTERNAL ====== -->
    <script src="app.js"></script>
    <script>
        // Ensure desa list loads after app.js is available
        (function(){
            try {
                const run = () => { try { if (typeof loadDesaList === 'function') loadDesaList().catch(()=>{}); } catch(e){} };
                if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run); else setTimeout(run, 50);
                try { window.addEventListener('focus', run); document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') run(); }); } catch(e) {}
            } catch (e) {}
        })();

        // ===== FUNGSI NAVIGASI UNTUK TAB CanvasPRO =====
        function showCanvaspro() {
            document.getElementById('dukopsContent').style.display = 'none';
            document.getElementById('absenContent').style.display = 'none';
            document.getElementById('hanpanganContent').style.display = 'none';
            document.getElementById('canvasproContent').style.display = 'block';
            document.getElementById('canvasproContent').classList.add('active');
            // set active button
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btnCanvaspro').classList.add('active');
        }

        // Override fungsi show lainnya agar menutup canvaspro
        const origShowDukops = window.showDukops || function() {};
        window.showDukops = function() {
            document.getElementById('canvasproContent').style.display = 'none';
            document.getElementById('canvasproContent').classList.remove('active');
            document.getElementById('dukopsContent').style.display = 'block';
            document.getElementById('absenContent').style.display = 'none';
            document.getElementById('hanpanganContent').style.display = 'none';
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btnDukops').classList.add('active');
            if (typeof origShowDukops === 'function') origShowDukops();
        };

        const origShowAbsenTab = window.showAbsenTab || function() {};
        window.showAbsenTab = function() {
            document.getElementById('canvasproContent').style.display = 'none';
            document.getElementById('canvasproContent').classList.remove('active');
            document.getElementById('dukopsContent').style.display = 'none';
            document.getElementById('absenContent').style.display = 'block';
            document.getElementById('hanpanganContent').style.display = 'none';
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btnAbsen').classList.add('active');
            if (typeof origShowAbsenTab === 'function') origShowAbsenTab();
        };

        const origShowHanpangan = window.showHanpangan || function() {};
        window.showHanpangan = function() {
            document.getElementById('canvasproContent').style.display = 'none';
            document.getElementById('canvasproContent').classList.remove('active');
            document.getElementById('dukopsContent').style.display = 'none';
            document.getElementById('absenContent').style.display = 'none';
            document.getElementById('hanpanganContent').style.display = 'block';
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btnHanpangan').classList.add('active');
            if (typeof origShowHanpangan === 'function') origShowHanpangan();
        };
    </script>

</body>
</html>
