<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="robots" content="noindex, nofollow">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DUKOPS">
    <title>SISTEM PELAPORAN DUKOPS BABINSA</title>
    <meta name="theme-color" content="#0a1a3a">

    <link rel="icon" type="image/x-icon" href="icons/favicon.ico" />
    <link rel="icon" type="image/png" href="icons/favicon-96x96.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <script>
        (function () {
            if (window.location.protocol !== 'file:') {
                const link = document.createElement('link');
                link.rel = 'manifest';
                link.href = 'site.webmanifest';
                document.head.appendChild(link);
            }
        })();
    </script>

    <!-- Library eksternal -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" onerror="this.onerror=null;this.src='html2canvas.min.js'"></script>

    <!-- CSS MODULAR -->
    <link rel="stylesheet" href="css/main.css">

    <!-- Sembunyikan tooltip indikator Supabase -->
    <style>
        .indicator-tooltip { display: none !important; }
        .supabase-indicator { cursor: default; }

        /* Gaya untuk tab dengan iframe */
        .tab-iframe-content {
            display: none;
            padding: 0;
            background: #0f1b2f;
            border-radius: 12px;
            margin-top: 10px;
            height: 80vh;
            overflow: hidden;
        }
        .tab-iframe-content.active {
            display: block;
        }
        .tab-iframe-content iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
            background: #1a2744;
        }
        @media (max-width: 600px) {
            .tab-iframe-content {
                height: 70vh;
            }
        }

        /* Gaya khusus untuk tab GPS */
        .nav-btn.nav-btn-gps {
            background: linear-gradient(135deg, #0a2a1a, #1a4a2a);
            border-color: #2a8a4a;
            color: #7ad8a0;
        }
        .nav-btn.nav-btn-gps:hover {
            background: linear-gradient(135deg, #1a3a2a, #2a5a3a);
            border-color: #4aaa6a;
            color: #aaf8c0;
        }
        .nav-btn.nav-btn-gps.active {
            background: linear-gradient(135deg, #2a8a4a, #4aaa6a);
            border-color: #6aca8a;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(42, 138, 74, 0.4);
        }
        .nav-btn.nav-btn-gps i {
            color: #7ad8a0;
        }
        .nav-btn.nav-btn-gps.active i {
            color: #ffffff;
        }

        /* Gaya untuk tombol EXIT */
        .nav-btn.nav-btn-exit {
            background: linear-gradient(135deg, #2a0a0a, #4a1a1a);
            border-color: #8a2a2a;
            color: #f87a7a;
        }
        .nav-btn.nav-btn-exit:hover {
            background: linear-gradient(135deg, #3a1a1a, #5a2a2a);
            border-color: #aa4a4a;
            color: #ff9a9a;
        }
        .nav-btn.nav-btn-exit.active {
            background: linear-gradient(135deg, #8a2a2a, #aa4a4a);
            border-color: #ca6a6a;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(138, 42, 42, 0.4);
        }
        .nav-btn.nav-btn-exit i {
            color: #f87a7a;
        }
        .nav-btn.nav-btn-exit.active i {
            color: #ffffff;
        }
    </style>

</head>
<body>

    <!-- ====== INDIKATOR SUPABASE ====== -->
    <div id="supabaseIndicator" class="supabase-indicator indicator-checking" title="Status Koneksi Supabase">
        <div class="indicator-dot"></div>
        <span class="indicator-tooltip"></span>
    </div>

    <!-- ====== SPLASH SCREEN ====== -->
    <div id="splashScreen" class="splash-container-modern">
        <div class="splash-content">
            <div class="splash-logo-center">
                <img src="icons/favicon-96x96.png" alt="Lambang Kodam Udayana">
            </div>
            <div class="splash-title-center">DUKOPS</div>
            <div class="splash-title-center">BABINSA SUKASADA</div>
            <div class="splash-divider-center"></div>
            <div class="splash-subtitle-center">KODIM 1609/BULELENG</div>
            <div class="splash-kodim-center">Sistem Pelaporan Digitalisasi Babinsa</div>
            <div class="splash-progress-center">
                <div class="splash-progress-bar-center" id="splashProgressBar"></div>
            </div>
            <div class="splash-percentage-center" id="progressPercentage">20%</div>
            <div class="splash-army"></div>
        </div>
    </div>

    <!-- ====== APP CONTAINER ====== -->
    <div id="appContainer" class="container" style="display: none; opacity: 0;">

        <button id="installButton" style="display:none;">
            <i class="fas fa-download"></i> Install App
        </button>

        <!-- ===== HEADER ===== -->
        <div class="dukops-header">
            <div class="dukops-header-row">
                <div class="dukops-title-area">
                    <div class="dukops-header-title"></div>
                </div>
            </div>
        </div>

        <!-- ===== NAVIGASI ===== -->
        <div class="nav-buttons">
            <button class="nav-btn nav-btn-dukops active" id="btnDukops" onclick="showDukops()">DUKOPS</button>
            <button class="nav-btn nav-btn-absen" id="btnAbsen" onclick="showAbsenTab()">ABSEN</button>
            <button class="nav-btn nav-btn-hanpangan" id="btnHanpangan" onclick="showHanpangan()">PIKET</button>
            <!-- TAB GPS -->
            <button class="nav-btn nav-btn-gps" id="btnGps" onclick="showGpsTab()">
                <i class="fas fa-satellite-dish"></i> GPS
            </button>
            <!-- TAB CanvasPRO -->
            <button class="nav-btn nav-btn-canvaspro" id="btnCanvaspro" onclick="showCanvaspro()">CanvasPRO</button>
            <!-- TOMBOL EXIT -->
            <button class="nav-btn nav-btn-exit" id="btnExit" onclick="exitApp()">
                <i class="fas fa-power-off"></i> EXIT
            </button>
        </div>

        <!-- ===== CONTENT DUKOPS ===== -->
        <div id="dukopsContent">
            <div style="width:100%; margin:0 auto;">

                <label id="labelPilihDesa"><i class="fas fa-city"></i> Pilih Desa/Kelurahan:</label>
                <div class="select-wrapper" style="position:relative;">
                    <select id="selectDesa" onchange="loadSelectedDesa()">
                        <option value="">--Pilih desa/Kelurahan--</option>
                    </select>
                </div>
                <div id="loadingDesa" style="display:none;"><i class="fas fa-spinner fa-spin"></i> Memuat...</div>
                <div class="previewBox" id="previewDesa" style="display:none;"></div>

                <label id="labelKoordinat" style="display:none;"><i class="fas fa-map-pin"></i> Koordinat:</label>
                <div id="loadingKoordinat" style="display:none;"><i class="fas fa-spinner fa-spin"></i> Memuat koordinat...</div>
                <div class="previewBox" id="previewKordinat"><span style="color:#6a7a8a;">Pilih desa/Kelurahan untuk melihat koordinat</span></div>

                <label id="labelFotoKegiatan"><i class="fas fa-camera"></i> Foto Kegiatan:</label>
                <input type="file" id="gambar" accept="image/*" onchange="previewImage()">

                <label id="labelTanggalWaktu"><i class="fas fa-calendar-alt"></i> Tanggal & Waktu: <span id="tanggalWaktuLabelText">Pilih tanggal & waktu</span></label>
                <input type="datetime-local" id="tanggalWaktu" onchange="updateDatePreview()">

                <label><i class="fas fa-file-alt"></i> Narasi Kegiatan:</label>
                <div class="narasi-wrapper">
                    <textarea id="narasi" class="auto-height-textarea" rows="6" placeholder="Masukkan narasi kegiatan...✍️" oninput="checkInputCompletion(); autoResizeNarasi()"></textarea>
                </div>

                <canvas id="canvas"></canvas>

                <div class="action-buttons">
                    <button id="submitBtn" onclick="processSubmission()" disabled>
                        <i class="fas fa-download"></i> KIRIM dan DOWNLOAD
                    </button>
                    <button id="resetBtn" onclick="resetAll()"><i class="fas fa-redo"></i> RESET</button>
                    <button id="showAttendanceBtn" onclick="showAttendance()" class="btn-attendance btn-compact" title="Laporan Absensi" disabled>
                        <i class="fas fa-chart-bar"></i> LAPORAN
                    </button>
                </div>

                <div id="attendancePanel" style="display: none;">
                    <div class="attendance-header">
                        <button onclick="hideAttendance()" class="btn-close-3d btn-compact">TUTUP</button>
                    </div>
                    <div class="attendance-filters">
                        <span class="attendance-selected-desa" id="attendanceSelectedDesa">
                            Desa dipilih: <span id="attendanceSelectedDesaName">Silahkan Pilih Desa</span>
                        </span>
                        <div class="month-picker-area" id="attendanceMonthPicker" tabindex="0" role="button">
                            <input type="month" id="attendanceMonthFilter" onchange="loadAttendanceData()">
                        </div>
                    </div>
                    <div id="attendanceLoading" style="display: none; text-align: center; padding: 20px;">
                        <i class="fas fa-spinner fa-spin"></i> 🪖 Tunggu..laporan akan di tampilkan
                    </div>
                    <div id="attendanceSummary" class="attendance-summary" style="display: none;">
                        <div class="summary-row"><span>Total Laporan:</span><span id="totalReports">0</span></div>
                        <div class="summary-row"><span>Total Desa:</span><span id="totalDesa">0</span></div>
                        <div class="summary-row"><span>Pencapaian Target:</span><span id="targetStatus">0%</span></div>
                    </div>
                    <div id="attendanceList" style="max-height: 400px; overflow-y: auto;"></div>
                </div>

            </div>
        </div>

        <!-- ===== ABSEN ===== -->
        <div id="absenContent" style="display: none;">
            <div class="absen-card">
                <div class="absen-filter-row">
                    <div class="form-group">
                        <label>📅 TAHUN</label>
                        <select id="absenTahunSelect"><option>Memuat...</option></select>
                    </div>
                    <div class="form-group">
                        <label>📆 BULAN</label>
                        <select id="absenBulanSelect" disabled><option>Pilih tahun</option></select>
                    </div>
                </div>
            </div>
            <div id="absenResultContainer"></div>
            <div class="absen-info-text">✨ Mangsatria@2026</div>
        </div>

        <!-- ===== PIKET ===== -->
        <div id="hanpanganContent" class="tab-iframe-content">
            <iframe src="https://sukasada05.github.io/Hanpangan/" title="PIKET"></iframe>
        </div>

        <!-- ===== GPS ===== -->
        <div id="gpsContent" class="tab-iframe-content">
            <iframe src="https://campro-ramil-05.dukopbabinsa05.workers.dev/" title="GPS Campro"></iframe>
        </div>

        <!-- ===== CANVASPRO ===== -->
        <div id="canvasproContent" class="tab-iframe-content">
            <iframe src="https://canvas-pro.dukopbabinsa05.workers.dev/" title="CanvasPRO 2.1" allow="clipboard-read; clipboard-write"></iframe>
        </div>

    </div>

    <div id="absenScreenshotArea" style="position: fixed; left: -9999px; top: 0; width: 500px; background: white;"></div>

    <!-- ====== SCRIPT ====== -->
    <script src="app.js"></script>
    <script>
        // ===== FUNGSI NAVIGASI =====

        function showDukops() {
            document.querySelectorAll('.tab-iframe-content').forEach(el => {
                el.style.display = 'none';
                el.classList.remove('active');
            });
            document.getElementById('dukopsContent').style.display = 'block';
            document.getElementById('absenContent').style.display = 'none';
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btnDukops').classList.add('active');
        }

        function showAbsenTab() {
            document.querySelectorAll('.tab-iframe-content').forEach(el => {
                el.style.display = 'none';
                el.classList.remove('active');
            });
            document.getElementById('dukopsContent').style.display = 'none';
            document.getElementById('absenContent').style.display = 'block';
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btnAbsen').classList.add('active');
            if (typeof loadAbsenData === 'function') {
                setTimeout(loadAbsenData, 100);
            }
        }

        function showHanpangan() {
            document.getElementById('dukopsContent').style.display = 'none';
            document.getElementById('absenContent').style.display = 'none';
            document.querySelectorAll('.tab-iframe-content').forEach(el => {
                el.style.display = 'none';
                el.classList.remove('active');
            });
            const el = document.getElementById('hanpanganContent');
            el.style.display = 'block';
            el.classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btnHanpangan').classList.add('active');
        }

        function showGpsTab() {
            document.getElementById('dukopsContent').style.display = 'none';
            document.getElementById('absenContent').style.display = 'none';
            document.querySelectorAll('.tab-iframe-content').forEach(el => {
                el.style.display = 'none';
                el.classList.remove('active');
            });
            const el = document.getElementById('gpsContent');
            el.style.display = 'block';
            el.classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btnGps').classList.add('active');
        }

        function showCanvaspro() {
            document.getElementById('dukopsContent').style.display = 'none';
            document.getElementById('absenContent').style.display = 'none';
            document.querySelectorAll('.tab-iframe-content').forEach(el => {
                el.style.display = 'none';
                el.classList.remove('active');
            });
            const el = document.getElementById('canvasproContent');
            el.style.display = 'block';
            el.classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btnCanvaspro').classList.add('active');
        }

        // ===== FUNGSI EXIT =====
        function exitApp() {
            if (confirm('Yakin ingin keluar dari aplikasi?')) {
                // Coba tutup aplikasi
                if (window.close) {
                    window.close();
                }
                // Fallback: redirect ke halaman kosong
                document.body.innerHTML = `
                    <div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#0a1a3a;color:#ffffff;font-family:sans-serif;flex-direction:column;">
                        <i class="fas fa-check-circle" style="font-size:48px;color:#28a745;margin-bottom:20px;"></i>
                        <h2>Terima Kasih</h2>
                        <p style="color:#8ab4f8;">Aplikasi DUKOPS telah ditutup</p>
                        <button onclick="location.reload()" style="margin-top:20px;padding:10px 30px;background:#1a3a5a;border:none;border-radius:8px;color:#fff;cursor:pointer;">
                            <i class="fas fa-redo"></i> Buka Lagi
                        </button>
                    </div>
                `;
                // Hapus semua state
                localStorage.clear();
                sessionStorage.clear();
            }
        }

        // Override fungsi-fungsi original jika ada
        if (typeof window.originalShowHanpangan === 'undefined') {
            window.originalShowHanpangan = window.showHanpangan;
        }
        window.showHanpangan = showHanpangan;

        if (typeof window.originalShowAbsenTab === 'undefined') {
            window.originalShowAbsenTab = window.showAbsenTab;
        }
        window.showAbsenTab = showAbsenTab;

        if (typeof window.originalShowDukops === 'undefined') {
            window.originalShowDukops = window.showDukops;
        }
        window.showDukops = showDukops;

        // Load desa list
        (function(){
            try {
                const run = () => { 
                    try { 
                        if (typeof loadDesaList === 'function') {
                            loadDesaList().catch(()=>{});
                        }
                    } catch(e){}
                };
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', run);
                } else {
                    setTimeout(run, 50);
                }
                try { 
                    window.addEventListener('focus', run); 
                    document.addEventListener('visibilitychange', function(){ 
                        if (document.visibilityState === 'visible') run(); 
                    }); 
                } catch(e) {}
            } catch (e) {}
        })();

        // Set default tab
        document.addEventListener('DOMContentLoaded', function() {
            showDukops();
        });
    </script>

</body>
</html>
